# Les builds de l'application Flutter : Android (APK installable), iOS (sans
# signature) et web. Les vérifications (format, analyse, tests) sont dans ci.yml.
# Un tag `v*` publie l'APK dans les Releases GitHub.

name: App

on:
  push:
    branches: [master]
    paths: ["app/**", ".github/workflows/app.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (sans signature)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-web
          path: app/build/web

  release:
    name: Release (APK)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexora-android
          path: dist
      - run: mv dist/app-release.apk "dist/NEXORA-${GITHUB_REF_NAME}.apk"
        working-directory: .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
