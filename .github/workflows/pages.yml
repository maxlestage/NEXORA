# Publie le site sur GitHub Pages (https://maxlestage.github.io/NEXORA/) : le bundle
# WebAssembly, puis `nexora-site export`, qui écrit chaque page en fichier statique.
# Lancé à chaque push sur master, et par la fusion automatique (ci.yml).

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Bundle du navigateur (îlots et 3D)
        run: |
          cargo build --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir pkg \
            target/wasm32-unknown-unknown/wasm-release/nexora_site.wasm
      - name: Export statique
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          cargo run --release -- export ../dist --base "/${{ github.event.repository.name }}/"
      # GitHub Pages doit publier depuis GitHub Actions (et non depuis une branche).
      - name: Source de Pages = GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
