# Vérifie chaque push et chaque pull request, puis fusionne automatiquement dans
# master toute branche dont les vérifications passent (sauf master et les branches
# `wip/...`). Une pull request ouverte depuis une branche du dépôt est donc fusionnée
# dès qu'elle est verte ; GitHub la marque alors comme fusionnée.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (format, analyse, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  site:
    name: Site (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test

  ios-kit:
    name: iOS Swift — cœur (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Catalogues à jour avec l'app Flutter
        run: |
          apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          python3 Tools/sync_catalogs.py --check
      - run: swift test --package-path NexoraKit

  ios-app:
    name: iOS Swift — app (Xcode, simulateur)
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Le runner macOS ne sert que si l'app Swift (ou ce workflow) a changé.
      - name: L'app Swift a-t-elle changé ?
        id: changed
        working-directory: .
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base HEAD origin/master 2>/dev/null || echo "")
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE '^(ios/|app/assets/(models\.json|nouveautes\.md)|app/lib/data/|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: XcodeGen 2.46.0
        if: steps.changed.outputs.run == 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Générer le projet
        if: steps.changed.outputs.run == 'true'
        run: |
          xcodebuild -version
          xcodegen generate
      - name: Compiler et tester sur le simulateur
        if: steps.changed.outputs.run == 'true'
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for k in reversed(ios):
              for dev in d[k]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "Simulateur : $udid"
          xcodebuild test -project Nexora.xcodeproj -scheme Nexora \
            -destination "id=$udid" -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*(Sendable|isolat)|Test |\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"

  merge:
    name: Fusion dans master
    needs: [app, site, ios-kit, ios-app]
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Fusionner
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SHA"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "Déjà dans master."
            exit 0
          fi
          if git merge-base --is-ancestor HEAD "$SHA"; then
            git merge --ff-only "$SHA"
          else
            subject="$(git log -1 --format=%s "$SHA")"
            if ! git merge --no-ff --no-edit "$SHA" -m "Fusion automatique : $subject"; then
              # Seul conflit attendu : le catalogue des modèles, mis à jour à la fois
              # par le robot des modèles sur master et dans la branche. On le régénère
              # depuis internet (ou on garde la version de la branche).
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -n "$(echo "$conflicts" | grep -v -e '^app/assets/models.json$' -e '^site/public/models.json$')" ]; then
                echo "::error title=Fusion impossible::conflit sur : $conflicts"
                exit 1
              fi
              git checkout --theirs -- app/assets/models.json site/public/models.json
              python3 .github/scripts/update_models.py || echo "Catalogue gardé tel quel"
              git add app/assets/models.json site/public/models.json
              git commit --no-edit -m "Fusion automatique : $subject"
            fi
          fi
          git push origin HEAD:master
          echo "::notice title=Fusion automatique::fusionné dans master"
      # Un push fait avec GITHUB_TOKEN ne lance aucun workflow : on lance à la main le
      # déploiement du site, les builds de l'app et l'envoi sur TestFlight.
      - name: Déployer le site et construire l'app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY"
          gh workflow run heroku.yml --ref master --repo "$GITHUB_REPOSITORY"
          gh workflow run app.yml --ref master --repo "$GITHUB_REPOSITORY"
          gh workflow run testflight.yml --ref master --repo "$GITHUB_REPOSITORY"
