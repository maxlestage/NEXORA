# Le site de présentation (une application Paquets) : format, clippy (serveur et
# navigateur), tests, puis le bundle WebAssembly des îlots et des scènes 3D.

name: Site

on:
  push:
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Paquets et ses paquets (Active, Memoire, Vitesse, Securite) sont des dépôts
  # privés : Cargo les récupère par git avec le secret REPOS_TOKEN (un jeton GitHub
  # qui peut les lire), fourni par un assistant d'identifiants, jamais dans une URL.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: site

jobs:
  site:
    name: fmt, clippy, tests, WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Bundle du navigateur
        run: |
          cargo build --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir pkg \
            target/wasm32-unknown-unknown/wasm-release/nexora_site.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-site-pkg
          path: site/pkg
